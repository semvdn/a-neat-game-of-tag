name: Validate project

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Build full application
        run: npm run build

      - name: Build lightweight showcase
        run: npm run build:demo

      - name: Verify generated assets are committed
        run: git diff --exit-code -- styles.css demo/public/showcase/showcase_pair_gen7422.json

      - name: Run deterministic regression suite
        run: npm test
